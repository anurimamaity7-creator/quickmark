<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuickMark Teacher</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body style="font-family:Arial;text-align:center">
<h1>QuickMark</h1>
<button onclick="startClass()">Start Class</button>
<button onclick="endClass()">End Class</button>
<br>
<div id="qr" style="display:inline-block;margin:20px"></div>
<h2 id="timer"></h2>
<a href="report.html">View Report</a>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAN2yXlU6rs1VZ2-aBHUIVHw-5Wwwz_fU8",
  authDomain: "quickmark-3cf1d.firebaseapp.com",
  projectId: "quickmark-3cf1d",
  storageBucket: "quickmark-3cf1d.firebasestorage.app",
  messagingSenderId: "297256629437",
  appId: "1:297256629437:web:5459985c24cd22c11c33d4"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();


const STUDENT_URL = "https://anurimamaity7-creator.github.io/quickmark/student.html";

let cur = "", prev = "", secs = 30, timerId = null;

function newCode() {
  prev = cur;
  cur = Math.random().toString(36).substring(2, 10);
  db.collection("sessions").doc("current").set({token: cur, prevToken: prev, active: true});
  document.getElementById("qr").innerHTML = "";
  new QRCode(document.getElementById("qr"), STUDENT_URL + "?token=" + cur);
  secs = 30;
}

function startClass() {
  clearInterval(timerId);
  cur = ""; prev = "";
  newCode();
  timerId = setInterval(() => {
    secs--;
    document.getElementById("timer").innerText = "New code in " + secs + "s";
    if (secs <= 0) newCode();
  }, 1000);
}

function endClass() {
  clearInterval(timerId);
  db.collection("sessions").doc("current").set({token: "", prevToken: "", active: false});
  document.getElementById("qr").innerHTML = "";
  document.getElementById("timer").innerText = "Class ended";
}
</script>
</body>
</html>
