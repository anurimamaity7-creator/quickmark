<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mark Attendance</title>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial;text-align:center;background:#f0f4ff;padding:40px 15px;margin:0}
h1{font-size:32px;margin-bottom:30px}
input{font-size:22px;padding:15px;width:85%;max-width:320px;text-align:center;border-radius:10px;border:2px solid #999;outline:none}
button{background:#2456ff;color:white;border:none;padding:15px 40px;font-size:22px;border-radius:10px;margin-top:20px;cursor:pointer}
#msg{font-size:20px;font-weight:bold;margin-top:25px}
</style>
</head>
<body>

<h1>Mark Attendance</h1>

<input id="roll" type="number" placeholder="Roll No.">
<br>
<button onclick="submitAtt()">Submit</button>
<p id="msg"></p>

<script>
// --- APNA FIREBASE CONFIG YAHAN PASTE KARO ---
const firebaseConfig = {
  PASTE_YOUR_FIREBASE_CONFIG_HERE
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

async function submitAtt(){
  const rollVal = document.getElementById('roll').value;
  if(!rollVal){
    document.getElementById('msg').style.color = "red";
    document.getElementById('msg').innerText = "Roll No. likho";
    return;
  }
  const today = new Date().toISOString().slice(0,10);
  try{
    await db.collection("attendance").doc(today + "_" + rollVal).set({
      roll: Number(rollVal),
      date: today,
      time: new Date().toLocaleTimeString()
    });
    document.getElementById('msg').style.color = "green";
    document.getElementById('msg').innerText = "✅ Attendance Marked! Roll No. " + rollVal;
    document.getElementById('roll').value = "";
  }catch(e){
    document.getElementById('msg').style.color = "red";
    document.getElementById('msg').innerText = "Error: " + e.message;
  }
}
</script>
</body>
</html>
